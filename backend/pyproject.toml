[project]
name = "biomedical-literature-assistant-backend"
version = "0.1.0"
description = "Shared retrieval and answering service for the biomedical literature assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.117.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "pinecone>=10,<11",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "uvicorn>=0.30",
]

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.0",
]
